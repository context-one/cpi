name: Dependency compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Resolve the published dependencies from scratch, as pi install does.
      # No lockfile or peer-dependency bypass should hide incompatible ranges.
      - run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --package-lock=false
